# Site settings
title: Kotlin & Android Programming Guide
description: >-
  A comprehensive guide for Kotlin programming - from beginner to advanced.
  Learn the language fundamentals, OOP, collections, functional style,
  coroutines, and modern Android app development with Jetpack Compose.
baseurl: "/kotlin-guide-tutorial"
url: ""

# Theme
theme: just-the-docs
color_scheme: dark

# Mermaid diagrams
mermaid:
  version: "10.6.0"

# Search
search_enabled: true
search:
  heading_level: 2
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  tokenizer_separator: /[\s/]+/
  rel_url: true
  button: false

# Aux links (top right)
aux_links:
  "Kotlin Guide GitHub":
    - "https://github.com/MichaelTien8901/kotlin-guide-tutorial"
aux_links_new_tab: true

# Footer
footer_content: >-
  Kotlin & Android Programming Guide is not affiliated with JetBrains or Google.
  Content is provided for educational purposes.

# Back to top link
back_to_top: true
back_to_top_text: "Back to top"

# Navigation structure
nav_sort: case_sensitive
nav_external_links:
  - title: Kotlin Docs
    url: https://kotlinlang.org/docs/home.html
    hide_icon: false
  - title: Android Developers
    url: https://developer.android.com/
    hide_icon: false
  - title: Kotlin on GitHub
    url: https://github.com/JetBrains/kotlin
    hide_icon: false

# Callouts
callouts:
  warning:
    title: Warning
    color: yellow
  note:
    title: Note
    color: blue
  tip:
    title: Tip
    color: green
  important:
    title: Important
    color: red

# Default front matter
defaults:
  - scope:
      path: ""
    values:
      layout: default

# Build settings
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge

# Exclude from processing
exclude:
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/
  - README.md
  - CONTRIBUTING.md
  - LICENSE
  - examples/**/build/
  - examples/**/.gradle/
